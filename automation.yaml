blueprint:
  name: Fridge AI Content Analyzer (English Prompt)
  description: >-
    Takes a camera snapshot when the fridge door opens, runs it through an AI
    vision model, and creates/updates one To-Do item per recognized food item
    (name + description). Items already in the list are matched by name and
    only their description is refreshed, so a "best before" date you set by
    hand on the fridge-card (github.com/jan-tdy/fridge-card) survives the
    next scan. Items no longer detected are left in place - remove them
    yourself once you've used them up.
  domain: automation
  source_url: https://github.com
  input:
    door_sensor:
      name: Door Sensor
      description: The binary sensor tracking the fridge door.
      selector:
        entity:
          domain: binary_sensor
          device_class: door
    flashlight:
      name: Flashlight / Light
      description: The camera flash or internal fridge light.
      selector:
        entity:
          domain: light
    camera_feed:
      name: Camera
      description: The ESP32-CAM video feed entity.
      selector:
        entity:
          domain: camera
    todo_list:
      name: To-Do List
      description: The Home Assistant To-Do list where the inventory markdown will be saved.
      selector:
        entity:
          domain: todo

mode: single

trigger:
  - trigger: door.opened
    target:
      entity_id: !input door_sensor
    options:
      behavior: each
      for: '00:00:00'

conditions: []

actions:
  - action: light.turn_on
    target:
      entity_id: !input flashlight
  
  - delay:
      hours: 0
      minutes: 0
      seconds: 2
      milliseconds: 435

  - action: camera.snapshot
    target:
      entity_id: !input camera_feed
    data:
      filename: /config/www/fridge/fridge_latest.jpg

  - action: ai_task.generate_data
    data:
      task_name: Fridge summary
      instructions: >-
        Please generate a comprehensive inventory list of every item visible inside the refrigerator. 
        Do not use vague language like 'I don't know', 'maybe', or 'perhaps'. 
        Format the output exclusively as a Markdown list.
        
        Example format (a standard response may contain up to 20 lines):
        " - Butter [conf. 82%]; **2 pieces**; opened [conf. 08%]; *N/A*
        - Strawberry Yogurt [conf. 65%]; **6 pieces**; unopened [conf. 92%]; *small white cup*"
        
        CRITICAL RULES:
        1. Never include conversational filler like 'Based on the provided photo, I see...' Output only the raw data.
        2. Never use broad categories like 'vegetables' or 'bag'. State exactly what specific item you believe it is alongside your confidence score, e.g., 'broccoli [conf. 75%]'.
        3. If the fridge appears completely empty, reply exactly with: 'Error: {empty}'
        4. If the camera is blocked or only a blank white door panel is visible, reply exactly with: 'Error: {closed}'
      attachments:
        media_content_id: media-source://media_source/fridge/fridge_latest.jpg
        media_content_type: image/jpeg
        metadata:
          title: Fridge Snapshot
          thumbnail: /local/fridge/fridge_latest.jpg
          media_class: image
    response_variable: sum_fridge

  - delay:
      hours: 0
      minutes: 0
      seconds: 1
      milliseconds: 250

  - action: light.turn_off
    target:
      entity_id: !input flashlight

  - action: todo.get_items
    target:
      entity_id: !input todo_list
    data:
      status: needs_action
    response_variable: existing_items

  - variables:
      todo_entity: !input todo_list
      # Existing items as [{name_lower, uid}, ...], so re-scans update an
      # item in place (keeping any due date you set on it) instead of
      # duplicating it.
      existing_list: >-
        {% set ns2 = namespace(list=[]) %}
        {% for it in existing_items[todo_entity].items %}
          {% set ns2.list = ns2.list + [{'name_lower': it.summary | lower | trim, 'uid': it.uid}] %}
        {% endfor %}
        {{ ns2.list }}
      # Parse the AI's markdown list ("- Name [conf. NN%]; **qty**; status
      # [conf. NN%]; *notes*") into [{name, description}, ...]. Lines that
      # don't start with "-" (including the "Error: {empty}" / "Error:
      # {closed}" replies) are silently skipped.
      fridge_items: >-
        {% set ns = namespace(items=[]) %}
        {% for raw_line in sum_fridge.data.split('\n') %}
          {% set line = raw_line.strip() %}
          {% if line.startswith('-') %}
            {% set parts = line[1:].strip().split(';') %}
            {% set name = parts[0] | regex_replace('\s*\[conf\.[^\]]*\]', '') | regex_replace('\*+', '') | trim %}
            {% set rest = parts[1:] | map('trim') | map('regex_replace', '\*+', '') | list | join(' · ') %}
            {% if name | length > 0 %}
              {% set ns.items = ns.items + [{'name': name, 'description': rest}] %}
            {% endif %}
          {% endif %}
        {% endfor %}
        {{ ns.items }}

  - repeat:
      for_each: '{{ fridge_items }}'
      sequence:
        - variables:
            match_uid: >-
              {{ existing_list | selectattr('name_lower', 'equalto', repeat.item.name | lower | trim)
                 | map(attribute='uid') | list | first | default(none) }}
        - choose:
            - conditions:
                - condition: template
                  value_template: '{{ match_uid is not none }}'
              sequence:
                - action: todo.update_item
                  target:
                    entity_id: !input todo_list
                  data:
                    item: '{{ match_uid }}'
                    description: '{{ repeat.item.description }}'
          default:
            - action: todo.add_item
              target:
                entity_id: !input todo_list
              data:
                item: '{{ repeat.item.name }}'
                description: '{{ repeat.item.description }}'
