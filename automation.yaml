blueprint:
  name: Fridge AI Content Analyzer (English Prompt)
  description: >-
    Takes a camera snapshot when the fridge door opens, runs it through an AI
    vision model, and creates/updates one To-Do item per recognized food item:
    name plus separate quantity, condition, confidence and note fields, and an
    estimated bounding box (for fridge-card's detection-frame overlay). The AI
    is told which item names were already used on a previous scan (with their
    last known box location) and asked to reuse an exact name when it thinks
    it's the same physical item - there's no real training/memory involved,
    this is just per-request context, so it's a best-effort nudge rather than
    a guarantee. Items are also matched by name after the fact, so a "best
    before" date you set by hand on the fridge-card
    (github.com/jan-tdy/fridge-card) survives the next scan whenever the name
    comes back unchanged - and so does anything you edit by hand there:
    quantity, condition, note, Brand and a hand-drawn detection frame all
    stay put on the next scan instead of being overwritten by a fresh AI
    guess. Confidence is always the AI's latest estimate, since the AI - not
    you - sets it. Items no longer detected are left in place - remove them
    yourself once you've used them up.
  domain: automation
  source_url: https://github.com
  input:
    door_sensor:
      name: Door Sensor
      description: The binary sensor tracking the fridge door.
      selector:
        entity:
          domain: binary_sensor
          device_class: door
    flashlight:
      name: Flashlight / Light
      description: The camera flash or internal fridge light.
      selector:
        entity:
          domain: light
    camera_feed:
      name: Camera
      description: The ESP32-CAM video feed entity.
      selector:
        entity:
          domain: camera
    todo_list:
      name: To-Do List
      description: The Home Assistant To-Do list where the inventory markdown will be saved.
      selector:
        entity:
          domain: todo
    ai_language:
      name: AI Output Language
      description: >-
        Language the AI should use for item names and descriptions. The
        structural markup (confidence scores, box coordinates, formatting)
        stays the same either way - only the words change.
      default: english
      selector:
        select:
          options:
            - label: English
              value: english
            - label: Slovenčina
              value: slovak

mode: single

trigger:
  - trigger: door.opened
    target:
      entity_id: !input door_sensor
    options:
      behavior: each
      for: '00:00:00'

conditions: []

actions:
  - action: light.turn_on
    target:
      entity_id: !input flashlight

  - delay:
      hours: 0
      minutes: 0
      seconds: 2
      milliseconds: 435

  - action: camera.snapshot
    target:
      entity_id: !input camera_feed
    data:
      filename: /config/www/fridge/fridge_latest.jpg

  - action: todo.get_items
    target:
      entity_id: !input todo_list
    data:
      status: needs_action
    response_variable: existing_items

  - variables:
      todo_entity: !input todo_list
      ai_language: !input ai_language
      # Existing items as [{name_lower, uid, description}, ...], so
      # re-scans update an item in place (keeping any due date you set on
      # it) instead of duplicating it, and so the Brand/manually-drawn box
      # markers in its description can be carried forward - see the repeat
      # loop below.
      existing_list: >-
        {% set ns2 = namespace(list=[]) %}
        {% for it in existing_items[todo_entity]['items'] %}
          {% set ns2.list = ns2.list + [{'name_lower': it.summary | lower | trim, 'uid': it.uid, 'description': it.description | default('')}] %}
        {% endfor %}
        {{ ns2.list }}
      # "Name (previously around box x1,y1,x2,y2)" per existing item, fed
      # into the AI prompt below so it can try to reuse a name itself
      # instead of us guessing sameness by box overlap after the fact.
      existing_hints: >-
        {% set ns3 = namespace(parts=[]) %}
        {% for it in existing_items[todo_entity]['items'] %}
          {% set b = it.description | regex_findall('\[\[box:([\d.,]+?)(?:,m)?\]\]') %}
          {% set hint = it.summary ~ (' (previously around box ' ~ b[0] ~ ')' if b else '') %}
          {% set ns3.parts = ns3.parts + [hint] %}
        {% endfor %}
        {{ ns3.parts | join('; ') }}

  - action: ai_task.generate_data
    data:
      task_name: Fridge summary
      instructions: >-
        Please generate a comprehensive inventory list of every item visible inside the refrigerator.
        Do not use vague language like 'I don't know', 'maybe', or 'perhaps'.
        Format the output exclusively as a Markdown list. For each item, output exactly these
        fields in this order, separated by semicolons - always include every field, using 'none'
        for confidence/note/box only if you truly cannot provide one:
        "- <name>; qty: <quantity, e.g. '2 pieces'>; condition: <state, e.g. 'opened'/'unopened'>;
        confidence: <your confidence in this identification, 0-100>; note: <anything else worth
        noting, or 'none'>; box: <left,top,right,bottom - the item's location in the photo as a
        percentage (0-100, measured from the top-left corner) of the image width/height>"

        {%- if existing_hints %}

        These items were already identified in a previous scan of this same fridge:
        {{ existing_hints }}. If an item you see now is the same physical item as one of
        these (even if it looks slightly different - a different angle, partially eaten,
        different lighting - or sits at roughly the same box location as before), reuse its
        EXACT name from that list instead of inventing a new one. Only use a new name for
        something that is genuinely not in that list.
        {%- endif %}

        Example format (a standard response may contain up to 20 lines):
        " - Butter; qty: 2 pieces; condition: opened; confidence: 82; note: none; box: 12,34,26,41
        - Strawberry Yogurt; qty: 6 pieces; condition: unopened; confidence: 65; note: small white cup; box: 55,30,72,48"

        CRITICAL RULES:
        1. Never include conversational filler like 'Based on the provided photo, I see...' Output only the raw data.
        2. Never use broad categories like 'vegetables' or 'bag'. State exactly what specific item you believe it is, e.g. 'broccoli' rather than 'vegetable'.
        3. If the fridge appears completely empty, reply exactly with: 'Error: {empty}'
        4. If the camera is blocked or only a blank white door panel is visible, reply exactly with: 'Error: {closed}'
        5. Keep the field names ('qty', 'condition', 'confidence', 'note', 'box') exactly as shown, in English, regardless of output language.
        {%- if ai_language == 'slovak' %}
        6. Write the item name and the qty/condition/note VALUES in Slovak, e.g. 'maslo' instead of 'butter', 'otvorené'/'neotvorené' instead of 'opened'/'unopened'. Field names stay in English, as in rule 5.
        {%- endif %}
      attachments:
        media_content_id: media-source://media_source/fridge/fridge_latest.jpg
        media_content_type: image/jpeg
        metadata:
          title: Fridge Snapshot
          thumbnail: /local/fridge/fridge_latest.jpg
          media_class: image
    response_variable: sum_fridge

  - delay:
      hours: 0
      minutes: 0
      seconds: 1
      milliseconds: 250

  - action: light.turn_off
    target:
      entity_id: !input flashlight

  - variables:
      # Parse the AI's markdown list ("- Name; qty: ...; condition: ...;
      # confidence: NN; note: ...; box: x1,y1,x2,y2") into
      # [{name, qty, condition, confidence, note, box}, ...] - each field kept
      # separate so fridge-card can show/edit them individually and so a
      # manual correction to one field (see the repeat loop below) doesn't
      # require touching the others. Lines that don't start with "-"
      # (including the "Error: {empty}" / "Error: {closed}" replies) are
      # silently skipped, as are unrecognized field names.
      fridge_items: >-
        {% set ns = namespace(items=[]) %}
        {% for raw_line in sum_fridge.data.split('\n') %}
          {% set line = raw_line.strip() %}
          {% if line.startswith('-') %}
            {% set all_parts = line[1:].strip().split(';') %}
            {% set name = all_parts[0] | trim %}
            {% set ns2 = namespace(qty='', condition='', confidence='', note='', box='') %}
            {% for p in all_parts[1:] %}
              {% set pt = p.strip() %}
              {% set key = (pt.split(':', 1)[0].strip().lower() if ':' in pt else '') %}
              {% set val = (pt.split(':', 1)[1].strip() if ':' in pt else '') %}
              {% if key == 'qty' and val.lower() != 'none' %}
                {% set ns2.qty = val %}
              {% elif key == 'condition' and val.lower() != 'none' %}
                {% set ns2.condition = val %}
              {% elif key in ['confidence', 'conf'] and val.lower() != 'none' %}
                {% set ns2.confidence = val %}
              {% elif key == 'note' and val.lower() != 'none' %}
                {% set ns2.note = val %}
              {% elif key == 'box' and val.lower() != 'none' %}
                {% set ns2.box = val %}
              {% endif %}
            {% endfor %}
            {% if name | length > 0 %}
              {% set ns.items = ns.items + [{'name': name, 'qty': ns2.qty, 'condition': ns2.condition, 'confidence': ns2.confidence, 'note': ns2.note, 'box': ns2.box}] %}
            {% endif %}
          {% endif %}
        {% endfor %}
        {{ ns.items }}

  - repeat:
      for_each: '{{ fridge_items }}'
      sequence:
        - variables:
            match: >-
              {{ existing_list | selectattr('name_lower', 'equalto', repeat.item.name | lower | trim)
                 | list | first | default(none) }}
            existing_desc: '{{ match.description if match else "" }}'
            # A box is only preserved if it carries fridge-card's ",m" flag
            # (drawn by hand there) - an AI-set box without that flag is
            # left to refresh normally below.
            preserved_box_raw: >-
              {{ existing_desc | regex_replace('.*(\[\[box:[0-9.]+,[0-9.]+,[0-9.]+,[0-9.]+,m\]\]).*', '\\1') }}
            preserved_box: '{{ preserved_box_raw if preserved_box_raw != existing_desc else "" }}'
            preserved_brand_raw: >-
              {{ existing_desc | regex_replace('.*(\[\[brand:[^\]]*\]\]).*', '\\1') }}
            preserved_brand: '{{ preserved_brand_raw if preserved_brand_raw != existing_desc else "" }}'
            # Quantity/condition/note each carry the same idea as the box:
            # a "...m" marker key means it was edited on fridge-card, so it's
            # kept as-is; otherwise the AI's fresh value for this scan is
            # used. Confidence is always the AI's own latest estimate.
            qtym_raw: >-
              {{ existing_desc | regex_replace('.*\[\[qtym:([^\]]*)\]\].*', '\\1') }}
            qtym: '{{ qtym_raw if qtym_raw != existing_desc else none }}'
            condm_raw: >-
              {{ existing_desc | regex_replace('.*\[\[condm:([^\]]*)\]\].*', '\\1') }}
            condm: '{{ condm_raw if condm_raw != existing_desc else none }}'
            notem_raw: >-
              {{ existing_desc | regex_replace('.*\[\[notem:([^\]]*)\]\].*', '\\1') }}
            notem: '{{ notem_raw if notem_raw != existing_desc else none }}'
            qty_marker: >-
              {{ ('[[qtym:' ~ qtym ~ ']]') if qtym is not none else (('[[qty:' ~ repeat.item.qty ~ ']]') if repeat.item.qty else '') }}
            cond_marker: >-
              {{ ('[[condm:' ~ condm ~ ']]') if condm is not none else (('[[cond:' ~ repeat.item.condition ~ ']]') if repeat.item.condition else '') }}
            note_marker: >-
              {{ ('[[notem:' ~ notem ~ ']]') if notem is not none else (('[[note:' ~ repeat.item.note ~ ']]') if repeat.item.note else '') }}
            conf_marker: >-
              {{ ('[[conf:' ~ repeat.item.confidence ~ ']]') if repeat.item.confidence else '' }}
            ai_box: '{{ ("[[box:" ~ repeat.item.box ~ "]]") if repeat.item.box else "" }}'
            final_description: >-
              {{ [qty_marker, cond_marker, note_marker, conf_marker, (preserved_box if preserved_box else ai_box), preserved_brand] | select | join(' ') | trim }}
        - choose:
            - conditions:
                - condition: template
                  value_template: '{{ match is not none }}'
              sequence:
                - action: todo.update_item
                  target:
                    entity_id: !input todo_list
                  data:
                    item: '{{ match.uid }}'
                    description: '{{ final_description }}'
          default:
            - action: todo.add_item
              target:
                entity_id: !input todo_list
              data:
                item: '{{ repeat.item.name }}'
                description: '{{ final_description }}'
