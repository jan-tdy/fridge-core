blueprint:
  name: Fridge AI Content Analyzer (English Prompt)
  description: >-
    Takes a camera snapshot when the fridge door opens, runs it through an AI
    vision model, and creates/updates one To-Do item per recognized food item
    (name + description + an estimated bounding box for fridge-card's
    detection-frame overlay). The AI is told which item names were already
    used on a previous scan (with their last known box location) and asked
    to reuse an exact name when it thinks it's the same physical item -
    there's no real training/memory involved, this is just per-request
    context, so it's a best-effort nudge rather than a guarantee. Items are
    also matched by name after the fact, so a "best before" date you set by
    hand on the fridge-card (github.com/jan-tdy/fridge-card) survives the
    next scan whenever the name comes back unchanged - and so do a Brand
    you set on the card (the AI never writes to it) and a detection frame
    you drew by hand there (an AI-estimated one still refreshes normally on
    each scan). Items no longer detected are left in place - remove them
    yourself once you've used them up.
  domain: automation
  source_url: https://github.com
  input:
    door_sensor:
      name: Door Sensor
      description: The binary sensor tracking the fridge door.
      selector:
        entity:
          domain: binary_sensor
          device_class: door
    flashlight:
      name: Flashlight / Light
      description: The camera flash or internal fridge light.
      selector:
        entity:
          domain: light
    camera_feed:
      name: Camera
      description: The ESP32-CAM video feed entity.
      selector:
        entity:
          domain: camera
    todo_list:
      name: To-Do List
      description: The Home Assistant To-Do list where the inventory markdown will be saved.
      selector:
        entity:
          domain: todo
    ai_language:
      name: AI Output Language
      description: >-
        Language the AI should use for item names and descriptions. The
        structural markup (confidence scores, box coordinates, formatting)
        stays the same either way - only the words change.
      default: english
      selector:
        select:
          options:
            - label: English
              value: english
            - label: Slovenčina
              value: slovak

mode: single

trigger:
  - trigger: door.opened
    target:
      entity_id: !input door_sensor
    options:
      behavior: each
      for: '00:00:00'

conditions: []

actions:
  - action: light.turn_on
    target:
      entity_id: !input flashlight

  - delay:
      hours: 0
      minutes: 0
      seconds: 2
      milliseconds: 435

  - action: camera.snapshot
    target:
      entity_id: !input camera_feed
    data:
      filename: /config/www/fridge/fridge_latest.jpg

  - action: todo.get_items
    target:
      entity_id: !input todo_list
    data:
      status: needs_action
    response_variable: existing_items

  - variables:
      todo_entity: !input todo_list
      ai_language: !input ai_language
      # Existing items as [{name_lower, uid, description}, ...], so
      # re-scans update an item in place (keeping any due date you set on
      # it) instead of duplicating it, and so the Brand/manually-drawn box
      # markers in its description can be carried forward - see the repeat
      # loop below.
      existing_list: >-
        {% set ns2 = namespace(list=[]) %}
        {% for it in existing_items[todo_entity]['items'] %}
          {% set ns2.list = ns2.list + [{'name_lower': it.summary | lower | trim, 'uid': it.uid, 'description': it.description | default('')}] %}
        {% endfor %}
        {{ ns2.list }}
      # "Name (previously around box x1,y1,x2,y2)" per existing item, fed
      # into the AI prompt below so it can try to reuse a name itself
      # instead of us guessing sameness by box overlap after the fact.
      existing_hints: >-
        {% set ns3 = namespace(parts=[]) %}
        {% for it in existing_items[todo_entity]['items'] %}
          {% set b = it.description | regex_findall('\[\[box:([\d.,]+)\]\]') %}
          {% set hint = it.summary ~ (' (previously around box ' ~ b[0] ~ ')' if b else '') %}
          {% set ns3.parts = ns3.parts + [hint] %}
        {% endfor %}
        {{ ns3.parts | join('; ') }}

  - action: ai_task.generate_data
    data:
      task_name: Fridge summary
      instructions: >-
        Please generate a comprehensive inventory list of every item visible inside the refrigerator.
        Do not use vague language like 'I don't know', 'maybe', or 'perhaps'.
        Format the output exclusively as a Markdown list. For each item also estimate its
        location in the photo as a bounding box: the percentage (0-100, measured from the
        top-left corner) of the image width/height for the box's left, top, right and bottom
        edges, in that order.

        {%- if existing_hints %}

        These items were already identified in a previous scan of this same fridge:
        {{ existing_hints }}. If an item you see now is the same physical item as one of
        these (even if it looks slightly different - a different angle, partially eaten,
        different lighting - or sits at roughly the same box location as before), reuse its
        EXACT name from that list instead of inventing a new one. Only use a new name for
        something that is genuinely not in that list.
        {%- endif %}

        Example format (a standard response may contain up to 20 lines):
        " - Butter [conf. 82%]; **2 pieces**; opened [conf. 08%]; *N/A*; box: 12,34,26,41
        - Strawberry Yogurt [conf. 65%]; **6 pieces**; unopened [conf. 92%]; *small white cup*; box: 55,30,72,48"

        CRITICAL RULES:
        1. Never include conversational filler like 'Based on the provided photo, I see...' Output only the raw data.
        2. Never use broad categories like 'vegetables' or 'bag'. State exactly what specific item you believe it is alongside your confidence score, e.g., 'broccoli [conf. 75%]'.
        3. If the fridge appears completely empty, reply exactly with: 'Error: {empty}'
        4. If the camera is blocked or only a blank white door panel is visible, reply exactly with: 'Error: {closed}'
        {%- if ai_language == 'slovak' %}
        5. Write the item names and the free-text parts (quantity, condition, notes) in Slovak, e.g. 'maslo' instead of 'butter', 'otvorené'/'neotvorené' instead of 'opened'/'unopened'. Keep the structural markup exactly as in the example - the semicolons, '[conf. NN%]', 'box: x,y,x,y' and the bold/italic asterisks - only translate the words.
        {%- endif %}
      attachments:
        media_content_id: media-source://media_source/fridge/fridge_latest.jpg
        media_content_type: image/jpeg
        metadata:
          title: Fridge Snapshot
          thumbnail: /local/fridge/fridge_latest.jpg
          media_class: image
    response_variable: sum_fridge

  - delay:
      hours: 0
      minutes: 0
      seconds: 1
      milliseconds: 250

  - action: light.turn_off
    target:
      entity_id: !input flashlight

  - variables:
      # Parse the AI's markdown list ("- Name [conf. NN%]; **qty**; status
      # [conf. NN%]; *notes*; box: x1,y1,x2,y2") into
      # [{name, description}, ...], where description already carries a
      # trailing "[[box:x1,y1,x2,y2]]" marker for fridge-card's detection
      # frames whenever the AI provided one. Lines that don't start with
      # "-" (including the "Error: {empty}" / "Error: {closed}" replies)
      # are silently skipped.
      fridge_items: >-
        {% set ns = namespace(items=[]) %}
        {% for raw_line in sum_fridge.data.split('\n') %}
          {% set line = raw_line.strip() %}
          {% if line.startswith('-') %}
            {% set all_parts = line[1:].strip().split(';') %}
            {% set ns2 = namespace(desc_parts=[], box='') %}
            {% for p in all_parts %}
              {% set pt = p.strip() %}
              {% if pt.lower().startswith('box') %}
                {% set ns2.box = (pt.split(':', 1)[1].strip() if ':' in pt else '') %}
              {% else %}
                {% set ns2.desc_parts = ns2.desc_parts + [pt] %}
              {% endif %}
            {% endfor %}
            {% set name = ns2.desc_parts[0] | regex_replace('\s*\[conf\.[^\]]*\]', '') | regex_replace('\*+', '') | trim %}
            {% set rest = ns2.desc_parts[1:] | map('regex_replace', '\*+', '') | list | join(' · ') %}
            {% set description = rest ~ (' [[box:' ~ ns2.box ~ ']]' if ns2.box else '') %}
            {% if name | length > 0 %}
              {% set ns.items = ns.items + [{'name': name, 'description': description}] %}
            {% endif %}
          {% endif %}
        {% endfor %}
        {{ ns.items }}

  - repeat:
      for_each: '{{ fridge_items }}'
      sequence:
        - variables:
            match: >-
              {{ existing_list | selectattr('name_lower', 'equalto', repeat.item.name | lower | trim)
                 | list | first | default(none) }}
            existing_desc: '{{ match.description if match else "" }}'
            # A box is only preserved if it carries fridge-card's ",m" flag
            # (drawn by hand there) - an AI-set box without that flag is
            # left to refresh normally below.
            preserved_box_raw: >-
              {{ existing_desc | regex_replace('.*(\[\[box:[0-9.]+,[0-9.]+,[0-9.]+,[0-9.]+,m\]\]).*', '\\1') }}
            preserved_box: '{{ preserved_box_raw if preserved_box_raw != existing_desc else "" }}'
            preserved_brand_raw: >-
              {{ existing_desc | regex_replace('.*(\[\[brand:[^\]]*\]\]).*', '\\1') }}
            preserved_brand: '{{ preserved_brand_raw if preserved_brand_raw != existing_desc else "" }}'
            ai_box_raw: >-
              {{ repeat.item.description | regex_replace('.*(\[\[box:[^\]]*\]\]).*', '\\1') }}
            ai_box: '{{ ai_box_raw if ai_box_raw != repeat.item.description else "" }}'
            ai_text: >-
              {{ repeat.item.description | regex_replace('\s*\[\[box:[^\]]*\]\]\s*', ' ') | trim }}
            final_description: >-
              {{ (ai_text ~ ' ' ~ (preserved_box if preserved_box else ai_box) ~ ' ' ~ preserved_brand) | trim }}
        - choose:
            - conditions:
                - condition: template
                  value_template: '{{ match is not none }}'
              sequence:
                - action: todo.update_item
                  target:
                    entity_id: !input todo_list
                  data:
                    item: '{{ match.uid }}'
                    description: '{{ final_description }}'
          default:
            - action: todo.add_item
              target:
                entity_id: !input todo_list
              data:
                item: '{{ repeat.item.name }}'
                description: '{{ repeat.item.description }}'
